<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>追溯码打印页</title>
<script src="qrcodegen.js"></script>
<style>
  :root {
    --cols: 1;
    --gap: 0.5mm;
    --qr-scale: 1;
  }
  @page { margin: 2mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #fff; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
    line-height: 1.1;
  }
  .info-bar {
    padding: 8px 12px;
    background: #eff6ff;
    border-bottom: 1px solid #bfdbfe;
    font-size: 12px;
    color: #1e40af;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .toolbar {
    padding: 8px 12px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: #475569;
    position: sticky;
    top: 36px;
    z-index: 9;
  }
  .toolbar label { display: inline-flex; align-items: center; gap: 4px; }
  .toolbar select, .toolbar input[type="range"] {
    padding: 4px 6px;
    font-size: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    background: #fff;
    color: #1e293b;
  }
  .toolbar .val { min-width: 28px; text-align: center; color: #1e40af; font-weight: 600; }

  .print-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), 1fr);
    gap: var(--gap);
    padding: 2mm;
  }
  .print-label {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: space-between;
    border: 1px dashed #999;
    box-sizing: border-box;
    padding: 0.5mm 1mm;
    text-align: left;
    overflow: hidden;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .print-label .text-col {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 0.3mm;
    padding-right: 1mm;
    min-width: 0;
    overflow: hidden;
  }
  .print-label .p-product { font-size: 7pt; font-weight: 600; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .print-label .p-spec { font-size: 6.5pt; color: #333; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .print-label .qr-img {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    overflow: hidden;
  }
  .print-label .qr-img svg {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  .print-label .p-code { font-size: 7.5pt; font-family: "Courier New", monospace; font-weight: 600; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .print-label .p-batch { font-size: 6pt; color: #555; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .error-box { padding: 30px 16px; text-align: center; color: #dc2626; font-size: 14px; }
  .error-box .icon { font-size: 36px; margin-bottom: 8px; }
  @media print {
    .info-bar, .toolbar { display: none !important; }
    .print-grid { padding: 0; gap: 0; }
    .print-label { border: none; margin: 0; }
  }
</style>
</head>
<body>
<div class="info-bar" id="infoBar">加载中...</div>
<div class="toolbar" id="toolbar" style="display:none;">
  <label>每行
    <select id="colsSel">
      <option value="1" selected>1 个</option>
      <option value="2">2 个</option>
      <option value="3">3 个</option>
      <option value="4">4 个</option>
      <option value="5">5 个</option>
    </select>
  </label>
  <label>间距
    <select id="gapSel">
      <option value="0mm">无</option>
      <option value="0.5mm" selected>小</option>
      <option value="1mm">中</option>
      <option value="2mm">大</option>
    </select>
  </label>
</div>
<div class="print-grid" id="printGrid"></div>
<script>
(function() {
  "use strict";

  // 解析 URL 参数
  function getQuery(name) {
    const m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }

  // UTF-8 安全的 base64 解码（URL-safe 变体）
  function b64DecodeUtf8(str) {
    try {
      str = str.replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    } catch (e) { return null; }
  }

  // UTF-8 安全的 base64 编码（URL-safe 变体）
  function b64EncodeUtf8(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function pad(num, len) {
    let s = String(num);
    while (s.length < len) s = "0" + s;
    return s;
  }

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 生成二维码 SVG 字符串
  function svgQrString(text, sizePx) {
    if (typeof qrcode === "undefined") return null;
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const cell = sizePx / n;
    let rects = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          rects += '<rect x="' + (c * cell).toFixed(3) + '" y="' + (r * cell).toFixed(3) + '" width="' + cell.toFixed(3) + '" height="' + cell.toFixed(3) + '" fill="#000"/>';
        }
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + sizePx + '" height="' + sizePx + '" viewBox="0 0 ' + sizePx + ' ' + sizePx + '" shape-rendering="crispEdges"><rect width="' + sizePx + '" height="' + sizePx + '" fill="#fff"/>' + rects + '<\/svg>';
  }

  function buildCode(prefix, batch, seq) {
    return prefix + "-" + batch + "-" + pad(seq, 4);
  }

  function buildQrContent(d, code) {
    const fullData = { c: code, n: d.n, s: d.s, b: d.b, d: d.d, o: d.o };
    const b64 = b64EncodeUtf8(JSON.stringify(fullData));
    const prefix = d.u || "https://lie310225.github.io/trace-pages/";
    const sep = /[?&]$/.test(prefix) ? "" : (prefix.indexOf("?") >= 0 ? "&" : "?");
    return prefix + sep + "d=" + b64;
  }

  function renderError(msg) {
    document.getElementById("infoBar").style.display = "none";
    document.getElementById("toolbar").style.display = "none";
    document.getElementById("printGrid").innerHTML =
      '<div class="error-box"><div class="icon">!</div><div>' + escapeHtml(msg) + '</div></div>';
  }

  // 全局缓存解码后的数据，工具栏调整时复用
  let decodedData = null;

  // 渲染所有标签（每次调整工具栏都会调用）
  function renderLabels() {
    const d = decodedData;
    if (!d) return;
    const w = d.w || 40, h = d.h || 30;
    const prefix = d.x || "TR";
    const start = d.q || 1;
    const count = Math.max(1, Math.min(d.c || 10, 100));

    const MM_TO_PX = 3.7795;
    // 显示开关 / 自定义文本 / 字体缩放（编辑器 editor.html 写入；老 URL 不带则默认全显）
    const sp = d.sp !== false, ss = d.ss !== false, sc = d.sc !== false, sb = d.sb !== false;
    const ct = d.ct || "";
    const fS = d.fS || 1;
    // 文字行高度按显示项动态累加（pt → mm：1pt ≈ 0.353mm，加行距 1.5 倍）
    // 每行约 2.5mm；都关掉二维码可占满整个标签高度
    let textHeightMm = 0;
    if (sp) textHeightMm += 2.6 * fS;
    if (ss) textHeightMm += 2.4 * fS;
    if (sc) textHeightMm += 2.8 * fS;
    if (sb) textHeightMm += 2.2 * fS;
    if (ct) textHeightMm += 2.2 * fS;
    const paddingMm = 2;
    const maxQrByW = (w - paddingMm) * MM_TO_PX;
    const maxQrByH = (h - textHeightMm - paddingMm) * MM_TO_PX;
    // qrMm：用户指定时直接用；否则按"占标签高度 85% 或 宽度 55% 取小者"作为默认
    // 横向布局：文字在左，二维码在右；二维码宽高一致（正方形）
    let qrMm;
    if (d.qrMm > 0) {
      qrMm = d.qrMm;
    } else {
      qrMm = Math.min(h * 0.85, w * 0.55);
    }
    // qrPx：用于 SVG 渲染时的内部像素分辨率（max 400 保证清晰度）
    let qrPx = Math.max(60, Math.min(400, Math.floor(qrMm * 3.7795)));

    const grid = document.getElementById("printGrid");
    grid.innerHTML = "";
    // 显式设置每行标签数（与 editor.html 预览一致，避免只靠工具栏事件）
    const cols = Math.max(1, Math.min(parseInt(d.cols, 10) || 1, 5));
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";

    const labels = [];
    for (let i = 0; i < count; i++) {
      const seq = start + i;
      const code = buildCode(prefix, d.b, seq);
      const qrContent = buildQrContent(d, code);
      let svg = "";
      try { svg = svgQrString(qrContent, qrPx) || ""; } catch (e) { svg = ""; }
      // 强制 SVG 撑满 .qr-img 容器（inline style 优先级最高，避免 APP webview 不支持 max-width 切掉二维码）
      if (svg) {
        svg = svg.replace('<svg ', '<svg style="width:100%;height:100%;display:block;" ');
      }
      // 用显式 width/height mm 替代 aspect-ratio（旧版 Android WebView 不支持 aspect-ratio 会导致高度坍塌）
      let html = '<div class="print-label" style="width:' + w + 'mm;height:' + h + 'mm;max-width:100%;">';
      html += '<div class="text-col">';
      if (sp) html += '<div class="p-product" style="font-size:calc(7pt * ' + fS + ')">' + escapeHtml(d.n) + '</div>';
      if (ss) html += '<div class="p-spec" style="font-size:calc(6.5pt * ' + fS + ')">' + escapeHtml(d.s || "") + '</div>';
      if (sc) html += '<div class="p-code" style="font-size:calc(7.5pt * ' + fS + ')">' + escapeHtml(code) + '</div>';
      if (sb) html += '<div class="p-batch" style="font-size:calc(6pt * ' + fS + ')">批:' + escapeHtml(d.b) + ' | ' + escapeHtml(d.d || "") + '</div>';
      if (ct) html += '<div class="p-custom" style="font-size:calc(6pt * ' + fS + ');color:#555;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(ct) + '</div>';
      html += '</div>';
      html += '<div class="qr-img" style="width:' + qrMm + 'mm;height:' + qrMm + 'mm;max-width:50%;">' + svg + '</div>';
      html += '</div>';
      labels.push(html);
    }
    grid.innerHTML = labels.join("");

    document.getElementById("infoBar").textContent =
      "共 " + count + " 个追溯码 · " + w + "x" + h + "mm 标签 · 调好排版后在 APP 里点打印按钮";
  }

  // 工具栏交互
  function bindToolbar() {
    const colsSel = document.getElementById("colsSel");
    const gapSel = document.getElementById("gapSel");

    colsSel.addEventListener("change", () => {
      const grid = document.getElementById("printGrid");
      grid.style.gridTemplateColumns = "repeat(" + colsSel.value + ", 1fr)";
    });
    gapSel.addEventListener("change", () => {
      const grid = document.getElementById("printGrid");
      grid.style.gap = gapSel.value;
    });
  }

  function init() {
    const pParam = getQuery("p");
    if (!pParam) { renderError("未提供打印数据（URL 缺少 p 参数）"); return; }
    const json = b64DecodeUtf8(pParam);
    if (!json) { renderError("打印数据解码失败"); return; }
    let d;
    try { d = JSON.parse(json); }
    catch (e) { renderError("打印数据格式错误"); return; }
    if (!d.n || !d.b) { renderError("打印数据缺少产品名或批次号"); return; }

    decodedData = d;
    document.getElementById("toolbar").style.display = "flex";
    // 同步工具栏下拉与 URL 参数
    const colsSel = document.getElementById("colsSel");
    if (colsSel) colsSel.value = String(Math.max(1, Math.min(parseInt(d.cols, 10) || 1, 5)));
    const gapSel = document.getElementById("gapSel");
    if (gapSel && d.gap) gapSel.value = d.gap;
    bindToolbar();
    renderLabels();
  }

  init();
})();
</script>
</body>
</html>
